<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>登录 · PLM 物料数据治理</title>
  <style>
    :root { --bg:#0a0d12; --panel:#141a25; --line:#243043; --text:#eef3f8; --muted:#9aa9bd; --accent:#3ea6ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font: 14px/1.6 "Microsoft YaHei", Arial, sans-serif;
    }
    .box { width: 336px; padding: 26px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    h1 { margin: 0 0 6px; font-size: 17px; }
    .sub { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
    label { display: block; margin: 12px 0 5px; color: var(--muted); font-size: 12px; }
    input {
      width: 100%; padding: 8px 10px; background: #1b232f; color: var(--text);
      border: 1px solid var(--line); border-radius: 5px; font-size: 13px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; margin-top: 18px; padding: 9px 0; border: none; border-radius: 5px;
      background: var(--accent); color: #04121f; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .msg { margin-top: 12px; min-height: 18px; color: #ff7b7b; font-size: 12px; }
    .tip { margin-top: 14px; color: var(--muted); font-size: 11px; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>PLM 物料数据治理</h1>
    <p class="sub">角色：系统管理员 / 标准化员 / 设计</p>
    <label>用户名</label>
    <input id="u" autocomplete="username" autofocus />
    <label>密码</label>
    <input id="p" type="password" autocomplete="current-password" />
    <button id="go">登录</button>
    <div class="msg" id="m"></div>
    <div class="tip">首次使用：用户名 admin / std / design，初始密码 Plm@2026；<br />登录后请在右上角「修改密码」。</div>
  </div>
  <script>
    const $ = (s) => document.querySelector(s)
    const btn = $('#go')

    async function submit() {
      const m = $('#m')
      const u = String($('#u').value || '').trim()
      const p = String($('#p').value || '')
      if (!u || !p) { m.textContent = '请输入用户名和密码'; return }
      m.textContent = '正在登录…'
      btn.disabled = true
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ u, p }),
        })
        const j = await r.json().catch(() => ({}))
        if (!r.ok || !j.ok) { m.textContent = j.error || ('登录失败（' + r.status + '）'); btn.disabled = false; return }
        location.href = '/'
      } catch (e) {
        m.textContent = '请求失败：' + (e && e.message ? e.message : e)
        btn.disabled = false
      }
    }

    btn.onclick = submit
    $('#p').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit() })
    $('#u').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#p').focus() })
    // 已登录则直接进看板
    fetch('/api/auth/me', { credentials: 'same-origin' })
      .then((r) => { if (r.ok) location.replace('/') })
      .catch(() => { })
  </script>
</body>
</html>
